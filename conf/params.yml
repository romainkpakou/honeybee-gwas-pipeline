# ─────────────────────────────────────────────────────────────────────────────
# honeybee-gwas-pipeline — Paramètres utilisateur
# Assouplis pour dataset de test (5 échantillons)
# ─────────────────────────────────────────────────────────────────────────────

# Entrée / Sortie
input:          "samplesheet.csv"
outdir:         "results"
genome:         "data/reference/Amel_HAv3.1.fa"

# Phénotypes GWAS — deux options (laisser phenotype_file à null pour l'option 1) :
#   1. colonne 'phenotype' dans le samplesheet (activation automatique du GWAS)
#   2. fichier dédié : "sample,valeur" ou "FID IID valeur"
phenotype_file: null

# QC reads
min_quality: 20
min_length:  50

# Alignement
bwa_threads: 4

# GATK
gatk_java:       "-Xmx8g"
snp_qd:          2.0
snp_fs:          60.0
snp_mq:          40.0
snp_sor:         3.0
snp_mqranksum:  -12.5
snp_readposrank: -8.0

# Génétique des populations — assoupli pour 5 échantillons
maf:         0.01
geno:        0.5
mind:        0.5
hwe:         0.0001
ld_window:   50
ld_step:     10
ld_r2:       0.2
admixture_k: "2,3"

# GWAS — activé via la colonne 'phenotype' du samplesheet
gwas_model: "lmm"       # "lmm" (GEMMA) ; "logistic" pour un trait binaire
gwas_pval:  1e-6

# Ressources
max_cpus:   8
max_memory: "14.GB"
max_time:   "72.h"
