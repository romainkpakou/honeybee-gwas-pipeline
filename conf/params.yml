# ─────────────────────────────────────────────────────────────────────────────
# honeybee-gwas-pipeline — Modèle de configuration PRODUCTION
#
# Valeurs adaptées à une cohorte réelle (≥ 20–30 individus).
# Pour la démonstration à 5 échantillons de ce dépôt, utiliser plutôt :
#     nextflow run main.nf -profile test,docker
#
# Usage :
#     nextflow run main.nf -params-file conf/params.yml -profile docker
# ─────────────────────────────────────────────────────────────────────────────

# ── Entrée / Sortie ──────────────────────────────────────────────────────────
input:          "samplesheet.csv"     # sample,fastq_1,fastq_2,sex,population[,phenotype]
outdir:         "results"
genome:         "data/reference/Amel_HAv3.1.fa"

# Annotation GFF3 (NCBI). SnpEff construit une base locale correspondant
# exactement à cet assemblage. Laisser null pour désactiver l'annotation.
gff:            "data/reference/Amel_HAv3.1.gff.gz"
genome_species: "Apis mellifera"

# Phénotypes GWAS — deux options (laisser phenotype_file à null pour l'option 1) :
#   1. colonne 'phenotype' dans le samplesheet → GWAS activé automatiquement
#   2. fichier dédié : "sample,valeur" ou "FID IID valeur"
phenotype_file: null

# ── QC des lectures ──────────────────────────────────────────────────────────
min_quality: 20
min_length:  50

# ── Alignement ───────────────────────────────────────────────────────────────
bwa_threads: 8

# ── GATK — filtres "hard-filtering" Best Practices (SNPs) ─────────────────────
gatk_java:       "-Xmx8g"
snp_qd:          2.0
snp_fs:          60.0
snp_mq:          40.0
snp_sor:         3.0
snp_mqranksum:  -12.5
snp_readposrank: -8.0

# ── Génétique des populations / GWAS ─────────────────────────────────────────
maf:            0.05     # fréquence allélique mineure minimale
geno:           0.05     # taux max de génotypes manquants par SNP
mind:           0.10     # taux max de génotypes manquants par individu
hwe:            1e-6
hwe_filter:     false    # filtrage HWE — à éviter en population structurée A/M/C
ld_window:      50       # kb — fenêtre d'élagage LD
ld_step:        10
ld_r2:          0.2
pca_components: 20       # nombre de PC (doit rester < nombre d'individus)
plink_bad_ld:   false    # mettre true seulement si < 50 individus
admixture_k:    "2,3,4,5"

gwas_model:     "lmm"    # "lmm" (GEMMA) ; "logistic" pour un trait binaire
gwas_pval:      1e-6

# ── Plafonds de ressources (adapter à la machine / au cluster) ───────────────
max_cpus:   8
max_memory: "14.GB"
max_time:   "72.h"
